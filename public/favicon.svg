<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- A white rounded square for contrast against dark browser tabs -->
  <rect width="100" height="100" rx="20" fill="white" />
  
  <!-- Use the original logo, but scale it up and align to the left inside the square so it focuses on the icon -->
  <!-- Assuming the logo has text on the right, this will crop the text out and center the drop icon. -->
  <svg x="10" y="10" width="80" height="80" viewBox="0 0 100 100">
    <image href="/logo.png" x="-10" y="10" width="220" height="80" preserveAspectRatio="xMinYMid slice" />
  </svg>
</svg>
